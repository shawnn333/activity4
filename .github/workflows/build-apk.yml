name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Patch abandoned plugins for Gradle 9 / AGP 8+ compatibility
        run: |
          # Fix 1: jcenter() was removed in Gradle 9. Old plugins that
          # still call it crash before their build.gradle can even be
          # evaluated. jcenter has redirected to mavenCentral since 2021.
          for f in $(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 3 -name "build.gradle" 2>/dev/null); do
            if grep -q "jcenter()" "$f"; then
              echo "Removing jcenter() in $f"
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
            fi
          done

          # Fix 2: AGP 8+ requires every Android module to declare a
          # `namespace` in build.gradle instead of relying on the
          # <manifest package="..."> attribute. Old plugins predate this
          # requirement. Pull the package name out of each plugin's own
          # manifest and inject it as the namespace if one isn't already
          # declared.
          for manifest in $(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 5 -path "*/android/src/main/AndroidManifest.xml" 2>/dev/null); do
            build_gradle="$(dirname "$(dirname "$(dirname "$manifest")")")/build.gradle"
            if [ -f "$build_gradle" ] && ! grep -q "namespace" "$build_gradle"; then
              pkg=$(grep -o 'package="[^"]*"' "$manifest" | head -n1 | sed 's/package="//;s/"//')
              if [ -n "$pkg" ]; then
                echo "Adding namespace \"$pkg\" to $build_gradle"
                sed -i "0,/android {/s//android {\n    namespace \"$pkg\"/" "$build_gradle"
              fi
            fi
          done

      - name: Strip legacy v1-embedding code from abandoned plugins
        run: |
          # nearby_connections' Java source still has a registerWith()
          # method for Flutter's old "v1 embedding" system, which Flutter
          # removed the Registrar class for entirely. flutter create has
          # generated v2-embedding-only apps for years (this one
          # included), so that method is never actually called - it's
          # dead code that just needs to stop referencing a class that no
          # longer exists. Strip it out with proper brace matching so
          # nested code inside it doesn't break the removal.
          python3 - <<'PYEOF'
          import glob, os, re

          pattern = os.path.expanduser(
              "~/.pub-cache/hosted/pub.dev/nearby_connections-*/android/src/main/**/*.java"
          )
          for path in glob.glob(pattern, recursive=True):
              with open(path, "r") as f:
                  src = f.read()
              if "PluginRegistry.Registrar" not in src:
                  continue
              original = src

              src = re.sub(
                  r"(?m)^import io\.flutter\.plugin\.common\.PluginRegistry\.Registrar;\n",
                  "",
                  src,
              )
              src = re.sub(
                  r"(?m)^\s*private static PluginRegistry\.Registrar \w+;\n",
                  "",
                  src,
              )

              marker = re.search(r"public static void registerWith\(", src)
              if marker:
                  brace_start = src.find("{", marker.start())
                  depth = 0
                  i = brace_start
                  while i < len(src):
                      if src[i] == "{":
                          depth += 1
                      elif src[i] == "}":
                          depth -= 1
                          if depth == 0:
                              break
                      i += 1
                  src = src[: marker.start()] + src[i + 1 :]

              if src != original:
                  with open(path, "w") as f:
                      f.write(src)
                  print(f"Stripped v1-embedding code from {path}")
          PYEOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
