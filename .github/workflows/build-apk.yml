name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Patch abandoned plugins for Gradle 9 (jcenter removal)
        run: |
          for f in $(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 3 -name "build.gradle" 2>/dev/null); do
            if grep -q "jcenter()" "$f"; then
              echo "Patching $f"
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
            fi
          done

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
